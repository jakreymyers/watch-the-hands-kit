<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="Menlo, Consolas, monospace">
  <rect width="880" height="460" fill="#ffffff"/>
  <text x="440" y="38" text-anchor="middle" font-size="22" fill="#1a1a1a" font-family="Helvetica, Arial, sans-serif">The silent downgrade</text>
  <text x="440" y="62" text-anchor="middle" font-size="14" fill="#666666" font-family="Helvetica, Arial, sans-serif">one run, three calls; every response says ok</text>

  <line x1="120" y1="400" x2="820" y2="400" stroke="#c9d2da" stroke-width="2"/>
  <text x="120" y="428" font-size="12" fill="#666666">19:12</text>
  <text x="450" y="428" font-size="12" fill="#666666">19:15</text>
  <text x="740" y="428" font-size="12" fill="#666666">19:18</text>

  <text x="110" y="105" font-size="13" fill="#666666" text-anchor="end">requested</text>
  <rect x="120" y="88" width="700" height="34" rx="4" fill="#dcebf7" stroke="#2a6fb3"/>
  <text x="140" y="110" font-size="14" fill="#1a1a1a">model: frontier   effort: high</text>

  <text x="110" y="165" font-size="13" fill="#666666" text-anchor="end">observed</text>
  <rect x="120" y="148" width="300" height="34" rx="4" fill="#dcebf7" stroke="#2a6fb3"/>
  <text x="140" y="170" font-size="14" fill="#1a1a1a">frontier / high</text>
  <rect x="420" y="148" width="220" height="34" rx="4" fill="#fdeeee" stroke="#b3402a"/>
  <text x="440" y="170" font-size="14" fill="#b3402a">frontier / low</text>
  <rect x="640" y="148" width="180" height="34" rx="4" fill="#fdeeee" stroke="#b3402a"/>
  <text x="660" y="170" font-size="14" fill="#b3402a">cheap / low</text>

  <text x="110" y="227" font-size="13" fill="#666666" text-anchor="end">reasoning</text>
  <text x="110" y="243" font-size="13" fill="#666666" text-anchor="end">tokens</text>
  <rect x="120" y="205" width="300" height="34" rx="4" fill="#f4f6f8" stroke="#c9d2da"/>
  <text x="140" y="227" font-size="14" fill="#1a1a1a">4,210</text>
  <rect x="420" y="205" width="400" height="34" rx="4" fill="#f4f6f8" stroke="#c9d2da"/>
  <text x="440" y="227" font-size="14" fill="#1a1a1a">0</text>

  <text x="110" y="305" font-size="13" fill="#666666" text-anchor="end">status</text>
  <text x="140" y="305" font-size="14" fill="#1a7a3c">ok</text>
  <text x="440" y="305" font-size="14" fill="#1a7a3c">ok</text>
  <text x="660" y="305" font-size="14" fill="#1a7a3c">ok</text>
  <text x="140" y="330" font-size="12" fill="#666666">no error from the provider at any point</text>

  <circle cx="430" cy="140" r="7" fill="#b3402a"/>
  <circle cx="650" cy="140" r="7" fill="#b3402a"/>
  <text x="430" y="80" font-size="12" fill="#b3402a" text-anchor="middle">alert: config_mismatch</text>
  <line x1="430" y1="86" x2="430" y2="132" stroke="#b3402a" stroke-width="2"/>
  <text x="650" y="80" font-size="12" fill="#b3402a" text-anchor="middle">alert: config_mismatch</text>
  <line x1="650" y1="86" x2="650" y2="132" stroke="#b3402a" stroke-width="2"/>

  <text x="440" y="452" text-anchor="middle" font-size="13" fill="#666666" font-family="Helvetica, Arial, sans-serif">the vendor sends no error; the alert is the error</text>
</svg>
